name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated schema
        run: |
          npm run generate-schema
          git diff --exit-code -- schemas/lombok-config.schema.json

      - name: Type-check
        run: npm run typecheck

      - name: Build tests
        run: npm run build-test

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build-prod
